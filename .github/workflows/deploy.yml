name: deploy

on:
  workflow_dispatch: {}

jobs:

  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PIP_INDEX_URL: 'https://:2023-04-16T23%3A56%3A46.279633Z@time-machines-pypi.sealsecurity.io/'

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9.16'
      - name: Package
        run: |
          echo "hatchling==1.14.0" > "${{ github.workspace }}/build-constraints.txt"
          pip install --upgrade build
          PIP_CONSTRAINT="${{ github.workspace }}/build-constraints.txt" python -m build -s -w
      - name: Upload Distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
